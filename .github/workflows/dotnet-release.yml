# =============================================================================
# Release Workflow - LIB-Shared-NET
# =============================================================================
# Complete CI/CD workflow for the shared platform libraries using reusable
# workflows from bauer-group/automation-templates:
# - PR validation (build & test)
# - Semantic versioning (conventional commits)
# - Automatic release creation
# - NuGet publishing to NuGet.org and GitHub Packages
# - Assembly signing with SNK key
#
# Uses conventional commits for automatic version bumping:
# - feat: -> minor version bump
# - fix: -> patch version bump
# - feat!: or BREAKING CHANGE: -> major version bump
#
# Required Secrets:
# - NUGET_API_KEY: API key for NuGet.org publishing
# - DOTNET_SIGNKEY_BASE64: Base64-encoded SNK key for assembly signing
# =============================================================================

name: 🚀 Release & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force create release (even without conventional commits)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  # ============================================
  # Validation (runs on all triggers)
  # ============================================
  validate:
    name: 🔨 Build & Test
    uses: bauer-group/automation-templates/.github/workflows/dotnet-build.yml@main
    with:
      project-path: "BAUERGROUP.Shared.slnx"
      dotnet-version: "10.0.x"
      run-tests: true
      collect-coverage: true
      # Windows runner for tests (Windows-specific tests need Windows)
      runs-on: "windows-latest"
      # LogFilePrefix instead of the default LogFileName: a fixed name makes every test
      # assembly (both TFMs of both test projects) overwrite the same trx.
      test-logger: "trx;LogFilePrefix=test-results"
      # SNK path must match AssemblyOriginatorKeyFile in Directory.Build.props
      snk-file-path: "build/BAUERGROUP.Shared.snk"
    secrets: inherit

  # ============================================
  # Linux Validation (Avalonia package, headless)
  # ============================================
  validate-linux:
    name: 🐧 Build & Test (Linux, Avalonia)
    uses: bauer-group/automation-templates/.github/workflows/dotnet-build.yml@main
    with:
      # Test csproj only - never the slnx: that would run the net*-windows test assembly
      # on Linux and build CefSharp and Stimulsoft for nothing.
      project-path: "tests/BAUERGROUP.Shared.Avalonia.Test/BAUERGROUP.Shared.Avalonia.Test.csproj"
      # Both SDKs: the test project multi-targets net8.0 and net10.0, and setup-dotnet
      # puts its own installation first on PATH, so the runner's preinstalled 8.0
      # runtime must not be relied on (comma-separated = a second setup-dotnet step).
      dotnet-version: "8.0.x,10.0.x"
      runs-on: "ubuntu-latest"
      run-tests: true
      collect-coverage: false
      # A `uses:` job cannot declare timeout-minutes itself - the reusable workflow
      # takes it as an input.
      timeout-minutes: 20
      test-logger: "trx;LogFilePrefix=test-results"
      # Signs when the secret is available; degrades to a warning otherwise. The test
      # project has no keyed InternalsVisibleTo, so it also builds unsigned (no CS0281).
      snk-file-path: "build/BAUERGROUP.Shared.snk"
    secrets: inherit

  # ============================================
  # Semantic Release (only on main branch push)
  # ============================================
  release:
    name: 📦 Create Release
    needs: [validate, validate-linux]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: "main"
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: "semantic-release-dotnet"
    secrets: inherit

  # ============================================
  # Publish NuGet Packages (after release)
  # ============================================
  publish:
    name: 📤 Publish to NuGet & GitHub
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/dotnet-publish-library.yml@main
    with:
      project-path: "BAUERGROUP.Shared.slnx"
      dotnet-version: "10.0.x"

      # Version from semantic-release
      release-version: ${{ needs.release.outputs.version }}

      # Build on Linux (default) - Windows TFMs work via EnableWindowsTargeting
      # runs-on: "ubuntu-latest" (default)

      # Tests already ran in validate job
      run-tests: false

      # Assembly signing
      sign-assembly: true

      # Publishing
      push-to-nuget: true
      push-to-github: true
      nuget-auth-method: "api-key"

      # Package options
      include-symbols: true
      include-source: true
      deterministic-build: true
    secrets: inherit

  # ============================================
  # PR Package Validation (only on pull requests)
  # ============================================
  pr-validate:
    name: 📋 Validate Package (PR)
    needs: [validate, validate-linux]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/dotnet-publish-library.yml@main
    with:
      project-path: "BAUERGROUP.Shared.slnx"
      dotnet-version: "10.0.x"

      # Preview version for PR
      version-suffix: "pr"

      # Build on Linux (default)
      # runs-on: "ubuntu-latest" (default)

      # Tests already ran in validate job
      run-tests: false

      # Build and validate package
      create-package: true
      include-symbols: true

      # Don't publish
      push-to-nuget: false
      push-to-github: false
    secrets: inherit

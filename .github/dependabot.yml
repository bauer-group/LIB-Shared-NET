# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automatic dependency updates for:
# - NuGet packages (weekly)
# - GitHub Actions (weekly)
#
# The commit prefix decides whether a merged update is released. This
# library's own releaseRules (.github/config/release/semantic-release.json)
# map deps to a PATCH release, so every merged update publishes packages:
#   nuget           -> deps(dotnet)  PATCH release, packages published to
#                                    NuGet.org and GitHub Packages
#   github-actions  -> chore(ci)     no release, never auto-merged
# dependabot-maintenance.yml merges with the GITHUB_TOKEN, which starts no
# push workflow, and therefore dispatches dotnet-release.yml itself.
# =============================================================================

version: 2
updates:
  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(dotnet)"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      avalonia:
        patterns:
          - "Avalonia*"
      testing:
        patterns:
          - "xunit*"
          - "AwesomeAssertions*"
          - "coverlet*"
          - "Moq*"
    # License-pinned packages: do not update.
    # Stimulsoft 2022.1.2 is the version covered by our license — see
    # Directory.Packages.props ("Version bleibt wegen Lizenz!").
    ignore:
      - dependency-name: "Stimulsoft.Dashboards.Win"
      - dependency-name: "Stimulsoft.Reports.Wpf"
      # xunit.v3 must stay on 3.x: Avalonia.Headless.XUnit 12.1.2 fails discovery on 4.x
      # (MissingMethodException) and 4.x forces Microsoft.Testing.Platform, which breaks
      # "dotnet test" over the solution on the .NET 10 SDK.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      # .NET runtime packages stay on the 10.x (LTS) line while net8.0 / net8.0-windows are
      # target frameworks: the 11.x packages no longer ship net8.0 assets, so net8.0 falls
      # back to netstandard2.0 - for System.Data.Odbc 11.0.0 that is the stub that throws
      # PlatformNotSupportedException ("System.Data.ODBC is not supported on this platform").
      # Patch and minor updates within 10.x still arrive. Remove these when net8.0 is dropped.
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Win32.SystemEvents"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Collections.Immutable"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Configuration.ConfigurationManager"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Data.Odbc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Runtime.Caching"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.ServiceProcess.ServiceController"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Encoding.CodePages"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"

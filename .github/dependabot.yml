# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automatic dependency updates for:
# - NuGet packages (weekly)
# - GitHub Actions (weekly)
# =============================================================================

version: 2
updates:
  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(dotnet)"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      avalonia:
        patterns:
          - "Avalonia*"
      testing:
        patterns:
          - "xunit*"
          - "AwesomeAssertions*"
          - "coverlet*"
          - "Moq*"
    # License-pinned packages: do not update.
    # Stimulsoft 2022.1.2 is the version covered by our license — see
    # Directory.Packages.props ("Version bleibt wegen Lizenz!").
    ignore:
      - dependency-name: "Stimulsoft.Dashboards.Win"
      - dependency-name: "Stimulsoft.Reports.Wpf"
      # xunit.v3 must stay on 3.x: Avalonia.Headless.XUnit 12.1.2 fails discovery on 4.x
      # (MissingMethodException) and 4.x forces Microsoft.Testing.Platform, which breaks
      # "dotnet test" over the solution on the .NET 10 SDK.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
